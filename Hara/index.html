    <div id="btnsContainer">

                style="background-color: #f44336; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer;">

    <table id="resultsTable">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
    </table>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        let localData = {
            men: [],
            women: []
        };

        // Load votes data from localStorage when the script starts
        let votesData = JSON.parse(localStorage.getItem('votesData')) || {};

        async function loadData() {
            try {
                // Replace with your Excel file path
                const response = await fetch('Haret El Naameh Elections.xlsx');
                const arrayBuffer = await response.arrayBuffer();
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });

                // Get data from sheets
                localData.men = XLSX.utils.sheet_to_json(workbook.Sheets['Men'], { header: 1 });
                localData.women = XLSX.utils.sheet_to_json(workbook.Sheets['Women'], { header: 1 });

                console.log('Data loaded successfully');
            } catch (error) {
                console.error('Error loading data:', error);
                alert('Error loading data. Please check console for details.');
            }
        }

        window.onload = function () {
            loadData();
            document.getElementById("resetButton").style.display = "none";
            document.getElementById('displayVotedPeopleButton').style.display = 'none';
        };

        function showSection(sectionId, element) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });

            document.querySelectorAll('nav a').forEach(link => {
                link.classList.remove('active');
            });

            document.getElementById(sectionId).classList.add('active');
            element.classList.add('active');

            if (sectionId === 'familySection') {
                document.getElementById('resultsTable').style.display = 'table';
                document.getElementById('resultCount').style.display = '';
                document.getElementById('registrationNumbersByFamilyName').style.display = '';
                document.getElementById('resetButton').style.display = 'none';
                document.getElementById('displayVotedPeopleButton').style.display = 'none';
                document.getElementById("voteResults").style.display = "none";

                const stored = sessionStorage.getItem('familySearchResults');
                if (stored) {
                    displayResults(JSON.parse(stored), false);
                } else {
                    displayResults([], true);
                }
            } else if (sectionId === 'regSection') {
                document.getElementById('resultsTable').style.display = 'table';
                document.getElementById('resultCount').style.display = '';
                document.getElementById('resetButton').style.display = '';
                document.getElementById('displayVotedPeopleButton').style.display = '';
                document.getElementById("voteResults").style.display = "";

                const stored = sessionStorage.getItem('regSearchResults');
                if (stored) {
                    displayResults(JSON.parse(stored), true);
                } else {
                    displayResults([], false);
                }
            }
        }

        function searchByFamilyName() {
            const familyName = document.getElementById('familyName').value;
            const gender = document.getElementById('familyGender').value;

            showLoading(true);

            // Use local data instead of API call
            const results = filterByFamilyNameLocal(familyName, gender);

            showLoading(false);
            displayResults(results, false);
            sessionStorage.setItem('familySearchResults', JSON.stringify(results));
            filterRegistrationNumbersByFamilyNameLocal(familyName);
        }

        function filterByFamilyNameLocal(familyName, gender) {
            let results = [];

            if (familyName === "الكل") {
                if (gender === "الكل") {
                    results = [...localData.men.slice(1), ...localData.women.slice(1)];
                } else if (gender === "رجال") {
                    results = localData.men.slice(1);
                } else {
                    results = localData.women.slice(1);
                }
            } else {
                if (gender === "الكل") {
                    const menResults = localData.men.slice(1).filter(row =>
                        row[6].toString().endsWith(familyName) &&
                        (familyName !== "حمود" || !row[6].toString().endsWith("محمود"))
                    );

                    const registrationNumbers = [...new Set(menResults.map(row => row[1]))];

                    const womenResults = localData.women.slice(1).filter(row =>
                        registrationNumbers.includes(row[1])
                    );

                    results = [...menResults, ...womenResults];
                } else if (gender === "رجال") {
                    results = localData.men.slice(1).filter(row =>
                        row[6].toString().endsWith(familyName) &&
                        (familyName !== "حمود" || !row[6].toString().endsWith("محمود"))
                    );
                } else {
                    const registrationNumbers = [...new Set(
                        localData.men.slice(1)
                            .filter(row => row[6].toString().endsWith(familyName) &&
                                (familyName !== "حمود" || !row[6].toString().endsWith("محمود")))
                            .map(row => row[1])
                    )];

                    results = localData.women.slice(1).filter(row =>
                        registrationNumbers.includes(row[1])
                    );
                }
            }

            return results.map(row => {
                while (row.length < 7) {
                    row.push('');
                }
                return row;
            });
        }

        function filterRegistrationNumbersByFamilyNameLocal(familyName) {
            const registrationNumbersByFamilyName = document.getElementById('registrationNumbersByFamilyName');
            registrationNumbersByFamilyName.innerHTML = '';

            let registrationNumbers = [];

            if (familyName === "الكل") {
                registrationNumbers = [...new Set(localData.men.slice(1).map(row => row[1]))];
            } else {
                registrationNumbers = [...new Set(
                    localData.men.slice(1)
                        .filter(row =>
                            row[6].toString().endsWith(familyName) &&
                            (familyName !== "حمود" || !row[6].toString().endsWith("محمود")))
                        .map(row => row[1])
                )];
            }

            const span = document.createElement('span');
            if (familyName !== 'الكل') {
                span.textContent = "سجلات بيت " + familyName + " : ";
            } else {
                span.textContent = " السجلات لجميع البيوت : ";
            }
            registrationNumbersByFamilyName.appendChild(span);

            registrationNumbers.forEach((regNumber, index) => {
                const span = document.createElement('span');
                if (index !== registrationNumbers.length - 1) {
                    span.textContent = `${regNumber} - `;
                } else {
                    span.textContent = `${regNumber}`;
                }
                registrationNumbersByFamilyName.appendChild(span);
            });
        }

        function searchByRegAndGender() {
            const regNumber = document.getElementById('regNumber').value;
            const gender = document.getElementById('gender').value;

            showLoading(true);

            // Use local data instead of API call
            const results = filterByRegistrationNumberLocal(regNumber, gender);

            showLoading(false);
            displayResults(results, true);
            sessionStorage.setItem('regSearchResults', JSON.stringify(results));

            // Get vote results from local storage
            const voteResults = getVoteResultsLocal(regNumber);
            displayVotedResults(voteResults);
        }

        function filterByRegistrationNumberLocal(registrationNumber, gender) {
            let results = [];

            if (registrationNumber === "الكل") {
                if (gender === "نساء") {
                    results = localData.women.slice(1);
                } else if (gender === "رجال") {
                    results = localData.men.slice(1);
                } else {
                    results = [...localData.men.slice(1), ...localData.women.slice(1)];
                }
            } else {
                if (gender === "نساء") {
                    results = localData.women.slice(1).filter(row => String(row[1]).trim() === registrationNumber);
                } else if (gender === "رجال") {
                    results = localData.men.slice(1).filter(row => String(row[1]).trim() === registrationNumber);
                } else {
                    results = [
                        ...localData.men.slice(1).filter(row => String(row[1]).trim() === registrationNumber),
                        ...localData.women.slice(1).filter(row => String(row[1]).trim() === registrationNumber)
                    ];
                }
            }

            // Add vote status to each row
            const voteData = votesData[registrationNumber] || { withUs: [], againstUs: [], noVote: [] };

            return results.map(row => {
                const rowKey = JSON.stringify(row);
                let voteStatus = "";

                if (voteData.withUs.includes(rowKey)) {
                    voteStatus = "with";
                } else if (voteData.againstUs.includes(rowKey)) {
                    voteStatus = "against";
                } else if (voteData.noVote.includes(rowKey)) {
                    voteStatus = "noVote";
                }

                return [...row, voteStatus];
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('resultsTable').style.display = show ? 'none' : 'table';
            document.getElementById('resultCount').style.display = show ? 'none' : 'block';
        }

        function displayResults(data, isRegSearch) {
            const tableHead = document.getElementById('tableHead');
            const tableBody = document.getElementById('tableBody');

            tableHead.innerHTML = '';
            tableBody.innerHTML = '';

            if (data.length === 0) {
                document.getElementById('resultCount').textContent = 'لا توجد نتائج';
                return;
            }

            const headers = [
                "ملاحظات",
                "رقم السجل",
                "المذهب",
                "تاريخ الولادة",
                "إسم ام وشهرتها",
                "إسم اب",
                "اسم والشهرة"
            ];

            if (isRegSearch) {
                headers.push("تصويت");
            }

            const headerRow = document.createElement('tr');
            headers.forEach(head => {
                const th = document.createElement('th');
                th.textContent = head;
                headerRow.appendChild(th);
            });
            tableHead.appendChild(headerRow);

            data.forEach(row => {
                const tr = document.createElement('tr');

                const voteStatus = isRegSearch ? row[row.length - 1] : null;
                const rowData = isRegSearch ? row.slice(0, -1) : row; // Remove vote status for display

                const displayData = [
                    rowData[0] || '', // ملاحظات
                    rowData[1] || '', // رقم السجل
                    rowData[2] || '', // المذهب
                    rowData[3] || '', // تاريخ الولادة
                    rowData[4] || '', // إسم ام وشهرتها
                    rowData[5] || '', // إسم اب
                    rowData[6] || ''  // اسم والشهرة
                ];

                displayData.forEach(value => {
                    const td = document.createElement('td');
                    td.textContent = value;
                    tr.appendChild(td);
                });

                if (isRegSearch) {
                    const tdButtons = document.createElement('td');
                    tdButtons.classList.add('tdButtons');

                    const withButton = document.createElement('button');
                    const againstButton = document.createElement('button');
                    const noVoteButton = document.createElement('button');

                    withButton.textContent = "مع";
                    againstButton.textContent = "ضد";
                    noVoteButton.textContent = "لا صوت";

                    if (voteStatus === "with") {
                        withButton.classList.add('selected');
                    } else if (voteStatus === "against") {
                        againstButton.classList.add('selected');
                    } else if (voteStatus === "noVote") {
                        noVoteButton.classList.add('selected');
                    }

                    withButton.addEventListener('click', () => {
                        VoteLocal(row[1], rowData, "with");
                        withButton.classList.add('selected');
                        againstButton.classList.remove('selected');
                        noVoteButton.classList.remove('selected');
                    });

                    againstButton.addEventListener('click', () => {
                        VoteLocal(row[1], rowData, "against");
                        againstButton.classList.add('selected');
                        withButton.classList.remove('selected');
                        noVoteButton.classList.remove('selected');
                    });

                    noVoteButton.addEventListener('click', () => {
                        VoteLocal(row[1], rowData, "noVote");
                        noVoteButton.classList.add('selected');
                        withButton.classList.remove('selected');
                        againstButton.classList.remove('selected');
                    });

                    withButton.classList.add('vote-btn');
                    againstButton.classList.add('vote-btn');
                    noVoteButton.classList.add('vote-btn');

                    tdButtons.appendChild(withButton);
                    tdButtons.appendChild(againstButton);
                    tdButtons.appendChild(noVoteButton);

                    tr.appendChild(tdButtons);
                }

                tableBody.appendChild(tr);
            });

            document.getElementById('resultCount').textContent = `عدد النتائج: ${data.length}`;
        }

        function VoteLocal(regNumber, row, status) {
            if (!votesData[regNumber]) {
                votesData[regNumber] = {
                    withUs: [],
                    againstUs: [],
                    noVote: []
                };
            }

            const rowKey = JSON.stringify(row);

            // Remove from all arrays first
            votesData[regNumber].withUs = votesData[regNumber].withUs.filter(r => r !== rowKey);
            votesData[regNumber].againstUs = votesData[regNumber].againstUs.filter(r => r !== rowKey);
            votesData[regNumber].noVote = votesData[regNumber].noVote.filter(r => r !== rowKey);

            // Add to the appropriate array
            if (status === "with") {
                votesData[regNumber].withUs.push(rowKey);
            } else if (status === "against") {
                votesData[regNumber].againstUs.push(rowKey);
            } else if (status === "noVote") {
                votesData[regNumber].noVote.push(rowKey);
            }

            // Save to localStorage
            localStorage.setItem('votesData', JSON.stringify(votesData));

            // Update the display
            const voteResults = getVoteResultsLocal(regNumber);
            displayVotedResults(voteResults);
        }

        function getVoteResultsLocal(regNumber) {
            const voteData = votesData[regNumber] || {
                withUs: [],
                againstUs: [],
                noVote: []
            };

            return {
                regNumber: regNumber,
                withUs: voteData.withUs.map(JSON.parse),
                againstUs: voteData.againstUs.map(JSON.parse),
                noVote: voteData.noVote.map(JSON.parse)
            };
        }

        function displayVotedResults(data) {
            const voteResults = document.getElementById("voteResults");

            if (!data) {
                voteResults.innerHTML = '';
                return;
            }

            const resultHTML = `
                <div style="font-size: 18px;">
                    <span style="color: #4CAF50;"> رقم السجل :</span> ${data.regNumber} &nbsp;&nbsp;
                    <span style="color: #4CAF50;"> مع:</span> ${data.withUs.length} &nbsp;&nbsp;
                    <span style="color: #F44336;"> ضد:</span> ${data.againstUs.length} &nbsp;&nbsp;
                    <span style="color: #FFC107;"> لا يصوت:</span> ${data.noVote.length}
                </div>
            `;

            voteResults.innerHTML = resultHTML;
            fillModal(data);
        }

        function resetVotes() {
            const regNumber = document.getElementById('regNumber').value;

            if (confirm(`هل أنت متأكد أنك تريد حذف جميع بيانات التصويت لرقم السجل ${regNumber}؟ لا يمكن التراجع عن هذا الإجراء!`)) {
                showLoading(true);

                if (votesData[regNumber]) {
                    delete votesData[regNumber];
                    localStorage.setItem('votesData', JSON.stringify(votesData));
                }

                showLoading(false);
                alert(`تم حذف جميع بيانات التصويت لرقم السجل ${regNumber} بنجاح`);
                document.getElementById("voteResults").innerHTML = '';
                searchByRegAndGender();
            }
        }

        function fillModal(data) {
            const votedPeople = document.getElementById("votedPeople");
            votedPeople.innerHTML = '';

            const registrationNumber = document.getElementById("regNumber");

            if (data.regNumber === registrationNumber.value) {
                const categories = [
                    { title: "مع", data: data.withUs, className: "with" },
                    { title: "ضد", data: data.againstUs, className: "against" },
                    { title: "لا صوت", data: data.noVote, className: "novote" },
                ];

                categories.forEach(category => {
                    const section = document.createElement('div');
                    section.className = 'voted-category';

                    const heading = document.createElement('h3');
                    heading.textContent = category.title;
                    section.appendChild(heading);

                    const list = document.createElement('div');
                    list.className = 'voted-list';

                    category.data.forEach(item => {
                        const name = document.createElement('div');
                        name.className = `voted-item ${category.className}`;
                        name.textContent = item[6]; // Assuming name is at index 6
                        list.appendChild(name);
                    });

                    section.appendChild(list);
                    votedPeople.appendChild(section);
                });
            }
        }
    </script>
</body>

</html>
